# Alpha Medical - Shopify Theme Check Configuration
# Documentation: https://shopify.dev/docs/themes/tools/theme-check
# Version: 1.0.0 | Session 143 | 23/01/2026

# Extend from Shopify's default theme-check config
extends: theme-check:recommended

# Custom rule severity overrides
DeprecateLazysizes:
  enabled: true
  severity: error

RequiredLayoutThemeObject:
  enabled: true
  severity: error

AssetSizeCSS:
  enabled: true
  threshold_in_bytes: 100000  # 100KB max per CSS file

AssetSizeJavaScript:
  enabled: true
  threshold_in_bytes: 50000   # 50KB max per JS file

ImgLazyLoading:
  enabled: true
  severity: error

ParserBlockingJavaScript:
  enabled: true
  severity: error

# Performance checks
RemoteAsset:
  enabled: true
  severity: warning

# Accessibility
RequiredParent:
  enabled: true

# Translation completeness
MatchingTranslations:
  enabled: true
  severity: warning

# Liquid syntax
LiquidTag:
  enabled: true

# Schema validation
ValidSchema:
  enabled: true
  severity: error

# Disabled checks (too noisy for current codebase)
SpaceInsideBraces:
  enabled: false

ContentForHeaderModification:
  enabled: false

# Alpha Medical specific: Forbidden patterns
# Note: Custom checks require theme-check plugins or external validation
