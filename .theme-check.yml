# Alpha Medical - Shopify Theme Check Configuration
# Documentation: https://shopify.dev/docs/storefronts/themes/tools/theme-check
# Version: 1.1.0 | Session 143 | 23/01/2026
# Valid checks: https://shopify.dev/docs/storefronts/themes/tools/theme-check/checks

# Extend from Shopify's default theme-check config
extends: theme-check:recommended

# Performance checks
DeprecateLazysizes:
  enabled: true
  severity: error

AssetSizeCSS:
  enabled: true
  threshold_in_bytes: 100000

AssetSizeJavaScript:
  enabled: true
  threshold_in_bytes: 50000

ParserBlockingJavaScript:
  enabled: true
  severity: error

RemoteAsset:
  enabled: true
  severity: suggestion

# Layout checks
RequiredLayoutThemeObject:
  enabled: true
  severity: error

# Translation checks
MatchingTranslations:
  enabled: true
  severity: suggestion

# Schema validation
ValidSchema:
  enabled: true
  severity: error

# Disabled checks (too noisy for current codebase)
ContentForHeaderModification:
  enabled: false
