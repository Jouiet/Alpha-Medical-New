name: API Health Check & Monitoring

on:
  schedule:
    # Runs every 6 hours
    - cron: '0 */6 * * *'

  # Allow manual triggering
  workflow_dispatch:

jobs:
  check-apis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Check Shopify Store
        id: shopify
        run: |
          echo "🏪 Checking Shopify store..."

          # Check public store URL
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://alphamedical.shop)

          if [ $HTTP_CODE -eq 200 ]; then
            echo "✅ Shopify store is UP (HTTP $HTTP_CODE)"
            echo "status=✅ UP" >> $GITHUB_OUTPUT
          else
            echo "❌ Shopify store is DOWN (HTTP $HTTP_CODE)"
            echo "status=❌ DOWN" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Check Apify API
        id: apify
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
        run: |
          echo "🔍 Checking Apify API..."

          python3 << 'PYTHON_SCRIPT'
          import requests
          import os
          import sys

          token = os.getenv('APIFY_API_TOKEN')
          if not token:
              print("❌ APIFY_API_TOKEN not configured")
              sys.exit(1)

          # Check Apify API health
          response = requests.get(f'https://api.apify.com/v2/acts?token={token}')

          if response.status_code == 200:
              actors = response.json().get('data', {}).get('items', [])
              print(f"✅ Apify API is UP ({len(actors)} actors available)")
          else:
              print(f"❌ Apify API is DOWN (HTTP {response.status_code})")
              sys.exit(1)
          PYTHON_SCRIPT

      - name: Check Google Sheets API (if configured)
        id: sheets
        continue-on-error: true
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          if [ -z "$GOOGLE_CREDENTIALS_JSON" ]; then
            echo "⚠️ Google Sheets API not configured (optional)"
            exit 0
          fi

          echo "📊 Checking Google Sheets API..."

          pip install gspread oauth2client

          python3 << 'PYTHON_SCRIPT'
          import gspread
          from oauth2client.service_account import ServiceAccountCredentials
          import json
          import os
          import sys

          # Setup credentials
          creds_json = os.getenv('GOOGLE_CREDENTIALS_JSON')
          if not creds_json:
              print("⚠️ Google Sheets credentials not found")
              sys.exit(0)

          try:
              creds_dict = json.loads(creds_json)
              scope = ['https://spreadsheets.google.com/feeds',
                       'https://www.googleapis.com/auth/drive']
              creds = ServiceAccountCredentials.from_json_keyfile_dict(creds_dict, scope)
              client = gspread.authorize(creds)

              # Try to list spreadsheets
              sheets = client.openall()
              print(f"✅ Google Sheets API is UP ({len(sheets)} sheets accessible)")
          except Exception as e:
              print(f"❌ Google Sheets API error: {e}")
              sys.exit(1)
          PYTHON_SCRIPT

      - name: Check GA4 & GTM Tags
        id: analytics
        run: |
          echo "📊 Checking Analytics tags..."

          # Check if GTM container is loading
          response=$(curl -s https://alphamedical.shop)

          if echo "$response" | grep -q "GTM-"; then
            echo "✅ GTM tag found on site"
          else
            echo "⚠️ GTM tag not detected"
          fi

      - name: Create health summary
        if: always()
        run: |
          echo "# 🏥 API Health Check Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Check Time:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Status:" >> $GITHUB_STEP_SUMMARY
          echo "- **Shopify Store:** ${{ steps.shopify.outputs.status || '❓ Unknown' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Apify API:** ${{ steps.apify.outcome == 'success' && '✅ UP' || '❌ DOWN' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Google Sheets:** ${{ steps.sheets.outcome == 'success' && '✅ UP' || steps.sheets.outcome == 'skipped' && '⚠️ Not configured' || '❌ DOWN' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Analytics:** ${{ steps.analytics.outcome == 'success' && '✅ Checked' || '⚠️ Check failed' }}" >> $GITHUB_STEP_SUMMARY

  notify-if-failure:
    needs: check-apis
    runs-on: ubuntu-latest
    if: failure()

    steps:
      - name: Create issue for failed health check
        uses: actions/github-script@v7
        with:
          script: |
            const now = new Date().toISOString();

            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 API Health Check Failed - ${now}`,
              body: `## Health Check Failure\n\n` +
                    `**Time:** ${now}\n\n` +
                    `One or more API health checks have failed. Please investigate:\n\n` +
                    `- Check Shopify store accessibility\n` +
                    `- Verify Apify API token\n` +
                    `- Check Google Sheets credentials (if configured)\n\n` +
                    `View the full workflow run: ${context.payload.repository.html_url}/actions/runs/${context.runId}`,
              labels: ['bug', 'automated', 'health-check']
            });
