name: Hashtags Trending Intelligence (Monthly)

on:
  schedule:
    # Runs 1x/month: 1st of each month at 9:00 AM UTC
    - cron: '0 9 1 * *'

  # Allow manual triggering
  workflow_dispatch:
    inputs:
      max_results:
        description: 'Max hashtags to analyze per platform'
        required: false
        default: '50'

jobs:
  scrape-trending-hashtags:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        platform: [instagram, tiktok]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd market-analysis
          pip install -r requirements.txt || pip install apify-client gspread oauth2client

      - name: Scrape ${{ matrix.platform }} trending hashtags
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
        run: |
          cd market-analysis

          MAX_RESULTS=${{ github.event.inputs.max_results || '50' }}

          echo "📈 Scraping ${{ matrix.platform }} TRENDING HASHTAGS - Max: $MAX_RESULTS"
          echo "📅 Purpose: Content calendar planning"

          # Scrape trending health/wellness hashtags
          case "${{ matrix.platform }}" in
            instagram)
              python3 lead_generation_scraper.py \
                --instagram \
                --hashtag "wellness" \
                --max-results $MAX_RESULTS
              ;;
            tiktok)
              python3 lead_generation_scraper.py \
                --tiktok \
                --hashtag "healthtips" \
                --max-results $MAX_RESULTS
              ;;
          esac

      - name: Upload trending data
        uses: actions/upload-artifact@v4
        with:
          name: trending-${{ matrix.platform }}-${{ github.run_number }}
          path: market-analysis/leads/general/*.json
          retention-days: 90

      - name: Display summary
        if: always()
        run: |
          cd market-analysis/leads/general
          echo "📊 Trending Hashtags - ${{ matrix.platform }}:"
          ls -lh *${{ matrix.platform }}*.json 2>/dev/null || echo "No data collected"

  sync-to-google-sheets:
    needs: scrape-trending-hashtags
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd market-analysis
          pip install gspread oauth2client

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: market-analysis/leads/general

      - name: Setup Google Sheets credentials
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          cd market-analysis
          echo "$GOOGLE_CREDENTIALS_JSON" > google_credentials.json

      - name: Sync to Google Sheets
        run: |
          cd market-analysis

          LEAD_FILES=$(find leads/general -name "*.json" -type f)

          if [ -z "$LEAD_FILES" ]; then
            echo "⚠️  No data to sync"
            exit 0
          fi

          for file in $LEAD_FILES; do
            echo "📤 Syncing: $file"
            python3 sync_leads_to_sheets.py "$file" || echo "Failed to sync $file"
          done

          echo "✅ Sync complete"

      - name: Cleanup
        if: always()
        run: rm -f market-analysis/google_credentials.json

  summary:
    needs: [scrape-trending-hashtags, sync-to-google-sheets]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Create summary
        run: |
          echo "# 📈 Trending Hashtags Intelligence - $(date +%Y-%m-%d)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Purpose:** Trending hashtags → Content calendar" >> $GITHUB_STEP_SUMMARY
          echo "**Frequency:** 1x/month (1st of month)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Results:" >> $GITHUB_STEP_SUMMARY
          echo "- Instagram: ${{ needs.scrape-trending-hashtags.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- TikTok: ${{ needs.scrape-trending-hashtags.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Sync: ${{ needs.sync-to-google-sheets.result }}" >> $GITHUB_STEP_SUMMARY
