name: Sync Typeform Contest Leads

on:
  schedule:
    # Hourly from 8 AM to 8 PM UTC (peak contest submission hours)
    - cron: '0 8-20 * * *'

  workflow_dispatch:
    inputs:
      hours:
        description: 'Fetch responses from last N hours'
        required: false
        default: '1'
      form_id:
        description: 'Typeform form ID (optional override)'
        required: false

jobs:
  sync-typeform-leads:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests gspread oauth2client python-dotenv

      - name: Create Google credentials file
        run: |
          echo '${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}' > google_credentials.json

      - name: Sync Typeform responses to Google Sheet
        env:
          TYPEFORM_API_TOKEN: ${{ secrets.TYPEFORM_API_TOKEN }}
          GOOGLE_SHEET_NAME: ${{ secrets.GOOGLE_SHEET_NAME }}
        run: |
          FORM_ID="${{ github.event.inputs.form_id }}"
          if [ -z "$FORM_ID" ]; then
            FORM_ID="${{ secrets.TYPEFORM_CONTEST_FORM_ID }}"
          fi

          HOURS="${{ github.event.inputs.hours }}"
          if [ -z "$HOURS" ]; then
            HOURS="1"
          fi

          python3 sync_typeform_to_sheet.py \
            --form-id "$FORM_ID" \
            --hours "$HOURS" \
            --source-tag "contest_typeform"

      - name: Clean up credentials
        if: always()
        run: |
          rm -f google_credentials.json

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Typeform sync failed. Check logs for details."
          # TODO: Add Slack/email notification here if needed
